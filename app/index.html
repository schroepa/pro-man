  <!--
    Inline watchdog: if the module bundle never boots (classic iOS symptom after a
    deploy — stale SW HTML → missing hashed assets → only canvas background),
    wipe Cache Storage + unregister SW and reload once.
  -->
  <script>
    (function () {
      var FAIL = "proman_sw_recovery";
      setTimeout(function () {
        if (window.__PROMAN_BOOTED__) return;
        try {
          if (sessionStorage.getItem(FAIL) === "1") return;
          sessionStorage.setItem(FAIL, "1");
        } catch (e) { /* ignore */ }

        var done = function () { location.reload(); };
        var tasks = [];
        if ("caches" in window) {
          tasks.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }));
        }
        if ("serviceWorker" in navigator) {
          tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }));
        }
        Promise.all(tasks).then(done).catch(done);
      }, 4000);
    })();
  </script>
