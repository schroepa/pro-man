<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Local-First, Accessible Project Management mit Kanban-Board, Gantt-Timeline und Docs Hub nach modernsten ClickUp-Erkenntnissen." />
  <title>ProMan - Local-First Workspace</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Schema.org WebApplication Metadata -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "ProMan",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires HTML5, File System Access API support recommended",
    "featureList": [
      "Kanban Board with keyboard and pointer drag-and-drop",
      "Interactive Gantt Chart with bar drag, end resize and dependency curves",
      "Docs Hub with Markdown editor (vault and localStorage)",
      "Client and project hierarchy with multi-filtering and search",
      "Local-First Markdown YAML storage (tasks/, docs/, clients.json)",
      "Accessibility basics: skip link, live region, focus rings",
      "File System Access API with localStorage fallback"
    ]
  }
  </script>

  <!-- Critical font: start download in parallel with CSS (Sans only) -->
  <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />

  <!-- CSS Stylesheets — fonts first so @font-face is discovered early -->
  <link rel="stylesheet" href="./src/styles/fonts.css" />
  <link rel="stylesheet" href="./src/styles/tokens.css" />
  <link rel="stylesheet" href="./src/styles/reset.css" />
  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/components/motion.css" />
  <link rel="stylesheet" href="./src/styles/components/layout.css" />
  <link rel="stylesheet" href="./src/styles/components/topbar.css" />
  <link rel="stylesheet" href="./src/styles/components/custom-select.css" />
  <link rel="stylesheet" href="./src/styles/components/board.css" />
  <link rel="stylesheet" href="./src/styles/components/list.css" />
  <link rel="stylesheet" href="./src/styles/components/gantt.css" />
  <link rel="stylesheet" href="./src/styles/components/calendar.css" />
  <link rel="stylesheet" href="./src/styles/components/docs.css" />
  <link rel="stylesheet" href="./src/styles/components/backoffice.css" />
  <link rel="stylesheet" href="./src/styles/components/dialog.css" />
  <link rel="stylesheet" href="./src/styles/components/command-palette.css" />
  <link rel="stylesheet" href="./src/styles/components/toast.css" />
</head>
<body>
  <!-- Accessible Skip Link (WCAG 2.4.1) -->
  <a href="#main-content" class="skip-link">Direkt zum Inhalt springen</a>

  <!-- ClickUp-Style Root Layout -->
  <div class="app-root">
    <div id="sidebar-container"></div>
    <div class="app-main-layout">
      <div id="topbar-container"></div>
      <main id="main-content" class="app-content-viewport" tabindex="-1">
        <div id="view-container"></div>
      </main>
    </div>
  </div>

  <!-- Screen Reader Live Announcements (WCAG 4.1.3) -->
  <div id="live-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Application Bootstrap -->
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
