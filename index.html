<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ProMan — Local-First Project Management" />
  <title>ProMan</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta http-equiv="refresh" content="0;url=/de/" />
  <script>
    (function () {
      var LOCALE_KEY = "proman_locale";
      var lang = "de";
      try {
        var stored = localStorage.getItem(LOCALE_KEY);
        if (stored === "en" || stored === "de") {
          lang = stored;
        } else if ((navigator.language || "").toLowerCase().indexOf("en") === 0) {
          lang = "en";
        }
      } catch (e) { /* ignore */ }
      location.replace("/" + lang + "/");
    })();
  </script>
</head>
<body>
  <p><a href="./de/index.html">Deutsch</a> · <a href="./en/index.html">English</a> · <a href="./app/index.html">App</a></p>
</body>
</html>
