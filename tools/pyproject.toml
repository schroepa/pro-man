[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promantools"
version = "0.1.0"
description = "Read-only CLI for ProMan vaults: reports and lint"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
promantools = "promantools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["promantools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
