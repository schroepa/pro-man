[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promantools"
version = "0.2.0"
description = "ProMan vault CLI (report/lint) + optional local MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
promantools = "promantools.cli:main"
proman-mcp = "promantools.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["promantools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
